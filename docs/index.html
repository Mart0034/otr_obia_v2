<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTR-finder</title>
<meta name="description" content="OTR-finder: finding mining tire dumps from satellite data. Proof of concept.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e8590c' stroke-width='5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e8590c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/style.css?v=202610141142">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<header class="top" id="top">
  <a class="brand" href="#top" aria-label="OTR-finder">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="16" cy="16" r="4" fill="currentColor"/></svg>
    <span>OTR-finder</span>
  </a>
  <nav aria-label="Main">
    <a href="#how" data-i18n="nav_how">How it works</a>
    <a href="#finds" data-i18n="nav_finds">Finds</a>
    <a href="#map" data-i18n="nav_map">Map</a>
    <a href="#results" data-i18n="nav_results">Results</a>
    <a href="#why" data-i18n="nav_why">Use cases</a>
    <a href="#contact" data-i18n="nav_contact">Contact</a>
  </nav>
  <div class="lang" role="group" aria-label="Language" data-i18n-aria="lang_label">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button><button type="button" data-lang="es">ES</button>
  </div>
</header>

<main id="main">
<section class="hero">
  <div class="wrap hero-inner">
    <p class="kicker" data-i18n="hero_kicker">Proof of concept</p>
    <h1 data-i18n="hero_title">Finding mining tire dumps from satellite images</h1>
    <p class="lead" data-i18n="hero_sub"></p>
    <p class="cta"><a class="btn primary" href="#map" data-i18n="cta_map">Explore the map</a> <a class="btn ghost" href="#how" data-i18n="cta_how">How it works</a></p>
    <dl class="stats" id="heroStats">
      <div><dd data-count="scan_ha">&ndash;</dd><dt><span data-i18n="stat_scan"></span> <small id="scanTiles"></small></dt></div>
      <div><dd data-count="known_places">&ndash;</dd><dt data-i18n="stat_known"></dt></div>
      <div class="hl"><dd data-count="found_places">&ndash;</dd><dt data-i18n="stat_found"></dt></div>
    </dl>
    <p class="gain" id="heroGain"></p>
  </div>
</section>

<section id="how" class="band">
  <div class="wrap">
    <h2 data-i18n="how_title"></h2>
    <p class="sub" data-i18n="how_lead"></p>
    <div class="examples" role="tablist" aria-label="Examples" id="exTabs"></div>
    <div class="stepper">
      <div class="steps" role="tablist" aria-label="Steps" id="stepTabs">
        <button role="tab" data-step="1" aria-selected="true"><b>1</b><span data-i18n="step1_t"></span></button>
        <button role="tab" data-step="2" aria-selected="false"><b>2</b><span data-i18n="step2_t"></span></button>
        <button role="tab" data-step="3" aria-selected="false"><b>3</b><span data-i18n="step3_t"></span></button>
        <button role="tab" data-step="4" aria-selected="false"><b>4</b><span data-i18n="step4_t"></span></button>
      </div>
      <figure class="chip">
        <div class="chip-imgs" id="chipImgs"></div>
        <div id="exMap" class="exmap" hidden></div>
        <div class="viewsw" role="group"><button type="button" data-exview="s2" class="on" data-i18n="ex_s2"></button><button type="button" data-exview="hi" data-i18n="ex_hi"></button></div>
        <figcaption id="chipCap"></figcaption>
      </figure>
      <div class="step-text">
        <h3 id="stepTitle"></h3><p id="stepDesc"></p>
        <div class="step-nav"><button class="btn ghost" id="prevStep" aria-label="Previous">&larr;</button><button class="btn primary" id="nextStep" aria-label="Next">&rarr;</button></div>
      </div>
    </div>
  </div>
</section>

<section id="finds" class="band alt">
  <div class="wrap">
    <h2 data-i18n="finds_title"></h2>
    <p class="sub" data-i18n="finds_lead"></p>
    <div class="gallery" id="gallery"></div>
    <p class="small" data-i18n="finds_note"></p>
  </div>
</section>

<section id="compare" class="band">
  <div class="wrap">
    <h2 data-i18n="cmp_title"></h2>
    <p class="sub" data-i18n="cmp_lead"></p>
    <div class="seg cmpseg" role="group" id="cmpSeg"><button type="button" data-cmp="start" data-i18n="cmp_start"></button><button type="button" data-cmp="now" class="on" data-i18n="cmp_now"></button></div>
    <div class="cmpbtns"><button type="button" class="btn ghost" id="cmpCloseBtn" data-i18n="cmp_close"></button><button type="button" class="btn ghost" id="cmpAllBtn" data-i18n="cmp_all"></button></div>
    <div class="cmpbox"><div id="cmpMap" role="application" aria-label="Map"></div></div>
    <ul class="legend cmplegend"><li><i class="sw sw-known"></i><span data-i18n="cmp_known"></span><em id="cmpKnown"></em></li><li id="cmpFoundLi"><i class="sw sw-found"></i><span data-i18n="cmp_found"></span><em id="cmpFound"></em></li></ul>
  </div>
</section>

<section id="map" class="band alt">
  <div class="wrap">
    <h2 data-i18n="map_title"></h2>
    <p class="sub" data-i18n="map_lead"></p>
    <p class="note places" data-i18n="places_note"></p>
    <div class="mapgrid">
      <div class="mapbox">
        <div id="mapEl" role="application" aria-label="Map"></div>
        <div class="basebtns" role="group"><button type="button" data-base="map" class="on" data-i18n="base_map"></button><button type="button" data-base="sat" data-i18n="base_sat"></button></div>
      </div>
      <aside class="side">
        <div class="seg" role="group" aria-label="View" id="viewSeg">
          <button type="button" data-view="start" data-i18n="view_start"></button>
          <button type="button" data-view="found" class="on" data-i18n="view_found"></button>
        </div>
        <ul class="legend">
          <li data-cat="known"><i class="sw sw-known"></i><span data-i18n="layer_known"></span><em data-n="known"></em></li>
          <li data-cat="found"><i class="sw sw-found"></i><span data-i18n="layer_found"></span><em data-n="found"></em></li>
        </ul>
        <p class="note" id="foundSplit"></p>
        <label class="chk"><input type="checkbox" id="minesToggle"><span data-i18n="layer_mines"></span><em data-n="mines"></em></label>
        <p class="note" data-i18n="privacy"></p>
        <h3 data-i18n="regions_title"></h3>
        <div id="regions"></div>
      </aside>
    </div>
  </div>
</section>

<section id="results" class="band">
  <div class="wrap">
    <h2 data-i18n="res_title"></h2>
    <p class="sub" data-i18n="res_lead"></p>
    <div class="proof" id="proof">
      <article class="card"><h3 data-i18n="ai_title"></h3><div class="big" id="aiBig"></div><p id="aiText"></p></article>
      <article class="card"><h3 data-i18n="low_title"></h3><div class="big" id="lowBig"></div><p id="lowText"></p></article>
      <article class="card"><h3 data-i18n="safe_title"></h3><div class="big" id="safeBig"></div><p id="safeText"></p></article>
    </div>
    <article class="card wide growth">
      <div class="growth-head"><div class="big" id="growthBig"></div><div><h3 data-i18n="growth_title"></h3><p id="growthText"></p></div></div>
      <div id="growthChart" role="img" aria-label="Growth chart"></div>
      <p class="small" data-i18n="growth_note"></p>
    </article>
    <div class="cards-res">
      <article class="card"><h3 data-i18n="gain_title"></h3><div id="gainChart" role="img" aria-label="Gain chart"></div><p id="gainText"></p></article>
      <article class="card"><h3 data-i18n="aiq_title"></h3><div id="aiBars"></div><p class="small" data-i18n="aiq_note"></p></article>
    </div>
    <article class="card wide sizes"><h3 data-i18n="size_title"></h3><p class="sub" data-i18n="size_lead"></p><div id="sizeChart"></div></article>
    <details class="rounds"><summary data-i18n="rounds_details"></summary><div id="chart" aria-live="polite"></div><p class="small" data-i18n="chart_note"></p></details>
    <div class="honest"><h3 data-i18n="honest_title"></h3><p id="honestText"></p></div>
  </div>
</section>

<section id="why" class="band alt">
  <div class="wrap">
    <h2 data-i18n="why_title"></h2>
    <div class="cards3">
      <article class="card"><h3 data-i18n="why1_t"></h3><p data-i18n="why1_d"></p></article>
      <article class="card"><h3 data-i18n="why2_t"></h3><p data-i18n="why2_d"></p></article>
      <article class="card"><h3 data-i18n="why3_t"></h3><p data-i18n="why3_d"></p></article>
    </div>
  </div>
</section>

<section id="contact" class="band">
  <div class="wrap narrow">
    <h2 data-i18n="contact_title"></h2>
    <p class="sub" data-i18n="contact_lead"></p>
    <form id="contactForm" novalidate>
      <label><span data-i18n="f_name"></span><input name="name" autocomplete="name" required></label>
      <label><span data-i18n="f_email"></span><input name="email" type="email" autocomplete="email" required></label>
      <label><span data-i18n="f_msg"></span><textarea name="msg" rows="4" required></textarea></label>
      <div class="formrow"><button class="btn primary" type="submit" data-i18n="f_send"></button><span class="demo" data-i18n="f_demo"></span></div>
      <p id="formMsg" role="status"></p>
    </form>
  </div>
</section>
</main>

<footer class="foot">
  <div class="wrap"><p data-i18n="foot_text"></p><p class="small" data-i18n="foot_data"></p></div>
</footer>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="data/examples.js?v=202610141142"></script>
<script src="data/data.js?v=202610141142"></script>
<script src="assets/i18n.js?v=202610141142"></script>
<script src="assets/app.js?v=202610141142"></script>
</body>
</html>
